services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: matchmaking
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d matchmaking']
      interval: 3s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PORT: '3000'
      DATABASE_URL: postgres://postgres:postgres@db:5432/matchmaking
    ports:
      - '3000:3000'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:3000/healthz',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 3s
      timeout: 3s
      retries: 15

  k6:
    image: grafana/k6:latest
    profiles: ['load']
    environment:
      BASE_URL: http://api:3000
    volumes:
      - ./load:/scripts
    depends_on:
      api:
        condition: service_healthy
    command: ['run', '/scripts/join-load-test.js']

volumes:
  pgdata:
